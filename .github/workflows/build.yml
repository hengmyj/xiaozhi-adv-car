name: Release Cardputer ADV Car

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build m5stack-cardputer-adv-car
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py m5stack-cardputer-adv-car --name m5stack-cardputer-adv-car

      - name: Collect artifacts
        shell: bash
        run: |
          VERSION=$(python3 -c 'from pathlib import Path
for line in Path("CMakeLists.txt").read_text().splitlines():
    if line.startswith("set(PROJECT_VER"):
        print(line.split("\"")[1]); break')
          echo "PROJECT_VER=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "build/xiaozhi-adv-car-v${VERSION}.bin" dist/
          cp releases/v${VERSION}_m5stack-cardputer-adv-car.zip dist/
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-adv-car-v${{ env.PROJECT_VER }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **xiaozhi-ADV-car v${{ env.PROJECT_VER }}** for M5Stack Cardputer ADV (ESP32-S3FN8, 8MB, no PSRAM).

            Flash `xiaozhi-adv-car-v${{ env.PROJECT_VER }}.bin` at **0x0** (full image: bootloader + partition table + app + assets):

            ```
            esptool.py --chip esp32s3 -p PORT -b 460800 write_flash 0x0 xiaozhi-adv-car-v${{ env.PROJECT_VER }}.bin
            ```

            First flash must be a full write; do not OTA from the stock 8m partition table.
